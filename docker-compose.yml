services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EVENT_GRAPH_FLASH_MODE: ${EVENT_GRAPH_FLASH_MODE:-false}
      EVENT_GRAPH_TEMPORAL_ENABLED: ${EVENT_GRAPH_TEMPORAL_ENABLED:-true}
      EVENT_GRAPH_LLM_TIMEOUT: ${EVENT_GRAPH_LLM_TIMEOUT:-300}
      EVENT_GRAPH_LLM_CONCURRENCY: ${EVENT_GRAPH_LLM_CONCURRENCY:-4}
      EVENT_GRAPH_LLM_MAX_TOKENS: ${EVENT_GRAPH_LLM_MAX_TOKENS:-6000}
      EVENT_GRAPH_TARGET_CHUNK_WORDS: ${EVENT_GRAPH_TARGET_CHUNK_WORDS:-350}
      EVENT_GRAPH_MAX_CHUNK_WORDS: ${EVENT_GRAPH_MAX_CHUNK_WORDS:-500}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_EVENTS: ${NEXT_PUBLIC_USE_MOCK_EVENTS:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_USE_MOCK_EVENTS: ${NEXT_PUBLIC_USE_MOCK_EVENTS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  neo4j_data:
