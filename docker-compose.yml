services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENABLE_DERIVES: ${ENABLE_DERIVES:-false}
      ENABLE_KERNEL_CLASSIFICATION: ${ENABLE_KERNEL_CLASSIFICATION:-true}
      ENABLE_PROMOTE: ${ENABLE_PROMOTE:-false}
      BACKBONE_REUSE_THRESHOLD: ${BACKBONE_REUSE_THRESHOLD:-0.80}
      BACKBONE_NEAR_THRESHOLD: ${BACKBONE_NEAR_THRESHOLD:-0.50}
      BACKBONE_MDL_MIN_COVERAGE: ${BACKBONE_MDL_MIN_COVERAGE:-3}
      BACKBONE_MDL_MIN_PAYLOAD: ${BACKBONE_MDL_MIN_PAYLOAD:-1}
      CONNECTIVITY_MAX_GENERALIZATION_HOPS: ${CONNECTIVITY_MAX_GENERALIZATION_HOPS:-1}
      ENABLE_FACET_IDENTITY: ${ENABLE_FACET_IDENTITY:-false}
      IDENTITY_BLOCK_THRESHOLD: ${IDENTITY_BLOCK_THRESHOLD:-0.82}
      ENABLE_JUDGE: ${ENABLE_JUDGE:-true}
      BACKBONE_COLLAPSE_THRESHOLD: ${BACKBONE_COLLAPSE_THRESHOLD:-0.90}
      ENABLE_CONTEXT_LAYER: ${ENABLE_CONTEXT_LAYER:-false}
      ENABLE_EVENT_TRIAGE: ${ENABLE_EVENT_TRIAGE:-false}
      PENDING_HYPOTHESIS_LISTEN_WINDOW: ${PENDING_HYPOTHESIS_LISTEN_WINDOW:-5}
      CONTEXT_AGENT_MAX_TURNS: ${CONTEXT_AGENT_MAX_TURNS:-4}
      EVENT_TRIAGE_MAX_TURNS: ${EVENT_TRIAGE_MAX_TURNS:-3}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_EVENTS: ${NEXT_PUBLIC_USE_MOCK_EVENTS:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_USE_MOCK_EVENTS: ${NEXT_PUBLIC_USE_MOCK_EVENTS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  neo4j_data:
